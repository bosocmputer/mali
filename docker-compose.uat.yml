# UAT stack — runs next to production on the same host, fully separate:
# own containers, own database volume, own uploads, port 3001.
#
#   docker compose -p mali-uat -f docker-compose.uat.yml --env-file uat.env up -d --build
#
# uat.env lives only on the server (never committed) and holds UAT-only values:
#   UAT_POSTGRES_PASSWORD, UAT_NEXTAUTH_SECRET, UAT_NEXTAUTH_URL
# No LINE token and no cron on purpose: UAT must never message real staff.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mali-uat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mali
      POSTGRES_PASSWORD: ${UAT_POSTGRES_PASSWORD}
      POSTGRES_DB: mali_uat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mali_uat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mali -d mali_uat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mali-uat-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    volumes:
      - mali_uat_uploads:/app/public/uploads
    environment:
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://mali:${UAT_POSTGRES_PASSWORD}@postgres:5432/mali_uat
      NEXTAUTH_SECRET: ${UAT_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${UAT_NEXTAUTH_URL}
      AUTH_COOKIE_PREFIX: mali-uat
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mali_uat_postgres_data:
  mali_uat_uploads:

services:

  postgres:
    image: postgres:16-alpine
    container_name: mali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mali
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mali_prod
    volumes:
      - mali_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mali -d mali_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mali-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    volumes:
      - mali_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  cron:
    image: alpine:3.20
    container_name: mali-cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - ./scripts/cron-entrypoint.sh:/entrypoint.sh:ro
    command: sh /entrypoint.sh

volumes:
  mali_postgres_data:
  mali_uploads:
